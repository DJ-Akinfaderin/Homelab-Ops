apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  namespace: garage
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: garage
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      # Sized for etcd snapshots + Kopia-deduplicated PVC backups, not raw
      # copies of everything — Kopia only stores changed chunks after the
      # first backup. Adjust once you see real usage.
      storage: 100Gi
