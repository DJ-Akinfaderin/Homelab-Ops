apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
# Single-node config — replication_factor=1 is correct here since Garage
# isn't providing the actual durability (NFS/your NAS is); it's just an S3
# API endpoint for whatever wants one. Currently unused — it was built as
# Velero's backup target, which was removed by request. See the top-level
# README for the current status.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    rpc_secret_file = "/etc/garage/secrets/rpc_secret"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/etc/garage/secrets/admin_token"
