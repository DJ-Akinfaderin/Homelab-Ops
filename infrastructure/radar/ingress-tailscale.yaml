# Ungated on purpose, matching Gatus's existing Tailscale
# routes — tailnet membership is already a real access control layer, and
# Authelia specifically protects the LAN path where anyone on home WiFi
# could otherwise reach it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar-tailscale
  namespace: radar
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: radar
      port:
        number: 9280
  tls:
    - hosts:
        - radar   # becomes radar.<your-tailnet-name>.ts.net
