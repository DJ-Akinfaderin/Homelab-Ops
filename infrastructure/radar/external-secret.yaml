# One random high-entropy secret — the HMAC key Radar signs session cookies
# with. Generate with `openssl rand -hex 64`, same pattern as Authelia's
# core secrets. Without an existingSecret, the chart auto-generates a
# random key at pod startup — meaning every restart invalidates all active
# sessions. This makes it durable across restarts instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-auth-secret
  namespace: radar
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: radar-auth-secret
    creationPolicy: Owner
  data:
    - secretKey: auth-secret
      remoteRef:
        key: "/radar/AUTH_SECRET"
