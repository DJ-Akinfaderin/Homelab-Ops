# CNPG's bootstrap.initdb.secret expects specifically-named keys
# (username, password) — this is that secret, sourced from Infisical like
# everything else. Username itself isn't sensitive, but keeping both in
# one place matches CNPG's expected shape.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-postgres-credentials
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: authelia-postgres-credentials
    creationPolicy: Owner
    template:
      data:
        username: authelia
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "/authelia/POSTGRES_PASSWORD"
