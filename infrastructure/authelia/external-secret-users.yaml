# Whole users_database.yml file, same "paste multi-line content into one
# Infisical secret" pattern used for tuppr's talosconfig — see README.md
# for how to generate the bcrypt hash and build this file's contents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users-database
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: authelia-users-database
    creationPolicy: Owner
  data:
    - secretKey: users_database.yml
      remoteRef:
        key: "/authelia/USERS_DATABASE_YML"
