# Three independent high-entropy secrets Authelia needs internally — not
# passwords you choose, random strings generated once. See README.md for
# the exact generation command. Consumed via the chart's
# secrets.existingSecret mechanism in release.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-core-secrets
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: authelia-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwtSecret
      remoteRef:
        key: "/authelia/JWT_SECRET"
    - secretKey: sessionSecret
      remoteRef:
        key: "/authelia/SESSION_SECRET"
    - secretKey: storageEncryptionKey
      remoteRef:
        key: "/authelia/STORAGE_ENCRYPTION_KEY"
