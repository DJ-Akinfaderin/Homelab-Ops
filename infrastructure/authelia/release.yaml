# Rewritten a third time, this time from the chart's actual real values
# file (`helm show values authelia/authelia --version 0.11.6`), not
# search fragments — every field below is confirmed against real content,
# not reconstructed from documentation or examples elsewhere.
#
# The secret-mounting mechanism is genuinely two-tiered, confirmed
# directly from the chart's top-level `secret:` block and the per-field
# pattern used identically by jwt_secret, session.encryption_key,
# storage.encryption_key, and storage.postgres.password:
#   1. secret.additionalSecrets.<name>: {} mounts a real Kubernetes
#      Secret (named exactly <name>) at /{secret.mountPath}/{name}/
#   2. Each config field then references secret_name (matching an
#      additionalSecrets key) + path (the key within that Secret) —
#      resolving to the file /{mountPath}/{secret_name}/{path}
#
# authelia_url is not a field anywhere in this schema (confirmed — it's
# rejected both inside cookies[] and at session level). The portal URL is
# derived automatically from each cookie's domain + subdomain instead.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  chart:
    spec:
      chart: authelia
      version: "0.11.6"
      sourceRef:
        kind: HelmRepository
        name: authelia
  values:
    # Mounts both real secrets into the pod — this is what makes the
    # secret_name references below actually resolve to something.
    secret:
      mountPath: /secrets
      additionalSecrets:
        authelia-core-secrets: {}
        authelia-postgres-credentials: {}

    pod:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      extraVolumeMounts:
        - name: users-database
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
      extraVolumes:
        - name: users-database
          secret:
            secretName: authelia-users-database

    # rulesOverride removed — the chart's own docs call it "a discouraged
    # override," and its path-matching template check was rejecting the
    # structure used here. The intended, default mechanism is auto-
    # deriving the ingress host from configMap.session.cookies' domain +
    # subdomain fields below (home.dakin.im + auth -> auth.home.dakin.im),
    # which is simpler and avoids this whole class of error.
    ingress:
      enabled: true
      className: traefik
      tls:
        enabled: true

    configMap:
      identity_validation:
        reset_password:
          secret:
            secret_name: authelia-core-secrets
            path: jwtSecret

      session:
        encryption_key:
          secret_name: authelia-core-secrets
          path: sessionSecret
        cookies:
          - domain: home.dakin.im
            subdomain: auth
            # Can't be identical to the auto-derived authelia_url
            # (https://auth.home.dakin.im) — Authelia's own validation
            # forbids that as a pointless redirect loop. Landing on Gatus
            # after a direct portal login is a reasonable default; change
            # to whatever makes sense once more apps sit behind this.
            default_redirection_url: "https://gatus.home.dakin.im"

      authentication_backend:
        file:
          disabled: false   # confirmed required — configuring the file path alone wasn't enough, matches the same disabled-by-default pattern as storage.postgres
          path: /config/users_database.yml

      access_control:
        default_policy: deny
        rules:
          - domain: "gatus.home.dakin.im"
            policy: two_factor
          - domain: "capacitor.home.dakin.im"
            policy: two_factor

      notifier:
        filesystem:
          disabled: false   # same pattern - configuring the filename alone wasn't enough
          filename: /config/notifications.txt

      storage:
        encryption_key:
          secret_name: authelia-core-secrets
          path: storageEncryptionKey
        postgres:
          enabled: true   # false by default — confirmed easy-to-miss field, caught this time by actually reading the real file
          address: "tcp://authelia-postgres-rw.authelia.svc.cluster.local:5432"   # tcp:// scheme required per the chart's own address docs
          database: authelia
          username: authelia
          password:
            secret_name: authelia-postgres-credentials
            path: password

    persistence:
      enabled: true
      size: 1Gi
