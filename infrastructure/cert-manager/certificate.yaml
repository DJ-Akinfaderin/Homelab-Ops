# One wildcard cert for everything behind Traefik, rather than a
# Certificate-per-app — this is the main advantage of DNS-01 over HTTP-01,
# which can't issue wildcards at all. Using a dedicated "home" subdomain
# so LAN services (jellyfin.home.dakin.im, immich.home.dakin.im, etc.)
# stay separate from anything else you might want to put on the apex
# domain later.
#
# Confirmed switched to production and successfully issuing — this
# reverted back to staging at least once already across a long session
# (same category of issue as other config regressions that day), so if
# you ever see a staging cert being served again despite this file
# showing prod, check `git log -- infrastructure/cert-manager/certificate.yaml`
# before assuming it's a new bug.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-default-cert
  namespace: kube-system
spec:
  secretName: traefik-default-cert-tls
  issuerRef:
    name: letsencrypt-cloudflare-prod
    kind: ClusterIssuer
  dnsNames:
    - "home.dakin.im"
    - "*.home.dakin.im"
