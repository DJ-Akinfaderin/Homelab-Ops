apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: ">=1.80.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    # Created once, out-of-band — see infrastructure/tailscale/README.md.
    # Never commit real client_id/client_secret values to Git.
    oauth:
      clientIdSecretRef:
        name: operator-oauth
        key: client_id
      clientSecretSecretRef:
        name: operator-oauth
        key: client_secret
    apiServerProxyConfig:
      mode: "false"   # not exposing kube-apiserver over Tailscale — Ingress use only
