apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: operator-oauth   # same Secret name the Tailscale operator already expects — nothing else changes
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: "/tailscale/CLIENT_ID"
    - secretKey: client_secret
      remoteRef:
        key: "/tailscale/CLIENT_SECRET"
