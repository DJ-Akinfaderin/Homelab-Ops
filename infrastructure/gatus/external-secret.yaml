# Reuses the exact same Infisical path as Alertmanager's Pushover secret
# (infrastructure/monitoring/external-secret.yaml) — same credential, two
# consumers, no need to duplicate it in Infisical. Key names differ from
# that one because Gatus's config expects specific env var names (see
# release.yaml's alerting.pushover block).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-pushover-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: gatus-pushover-credentials
    creationPolicy: Owner
  data:
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: "/pushover/USER_KEY"
    - secretKey: PUSHOVER_APPLICATION_TOKEN
      remoteRef:
        key: "/pushover/TOKEN"
