# Same reasoning as Capacitor: a status dashboard listing every app and
# its health is useful internal information, not something to expose on
# the LAN-facing Traefik path. Private-only via Tailscale.
#
# CONFIRMED via kubectl (was previously an unverified assumption of 8080,
# which turned out to be wrong and caused a real "service port not found"
# 404 on the LAN route): the chart's Service is named "gatus" on port 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus-tailscale
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gatus
      port:
        number: 80
  tls:
    - hosts:
        - gatus   # becomes gatus.<your-tailnet-name>.ts.net
