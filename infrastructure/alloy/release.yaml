# The Alloy/k8s-monitoring chart had a major v4 restructuring in April
# 2026 (Grafana's own words: "biggest update ever"). The shape below
# follows the officially documented pattern for "logs only, no metrics"
# (destinations + podLogsViaLoki), but given how recent and large that
# change was, verify against `helm show values grafana/k8s-monitoring`
# for whatever version gets pinned below before assuming every key here
# is exactly right — same category of caveat as the Immich chart elsewhere
# in this repo.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-monitoring
      version: ">=4.0.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    cluster:
      name: homelab

    destinations:
      - name: loki
        type: loki
        url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

    # This is the actual answer to "scrape logs from all applications" —
    # discovers every pod via the Kubernetes API, no per-app config.
    podLogsViaLoki:
      enabled: true
      destinations: ["loki"]

    # Bonus, same collector: Kubernetes Events (OOMKills, failed
    # schedules, image pull errors) land in Loki too, queryable
    # alongside pod logs rather than only living in `kubectl get events`'
    # short retention window.
    clusterEvents:
      enabled: true
      destinations: ["loki"]

    # Alloy runs as a DaemonSet by default — this just makes sure that
    # includes the control-plane node (PC1), which is otherwise tainted
    # against scheduling. Worth having: etcd/apiserver-adjacent logs are
    # useful precisely because that node is your single point of failure.
    alloy-logs:
      controller:
        tolerations:
          - operator: Exists
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
