# v4's real structure, confirmed against Grafana's own "Kubernetes
# Monitoring Helm chart v4: Biggest update ever!" blog post — the
# authoritative source, not inferred from an error message this time.
# Two changes from v3, both now applied:
#   1. destinations: is a map keyed by name, not a list (already fixed)
#   2. collectors: replaces named instances (alloy-metrics/alloy-logs)
#      with a user-defined map, each entry built from `presets:` —
#      confirmed via the chart's own validation error
#      ("At least one collector should be enabled") that this was the
#      actual missing piece, not a guess.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-monitoring
      version: ">=4.0.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    cluster:
      name: homelab

    # Points at VictoriaLogs, not Loki — type stays "loki" since Alloy is
    # still sending in Loki's wire format, VictoriaLogs just accepts it
    # natively on this endpoint. Service name assumes the chart's default
    # naming convention (<release-name>-victoria-logs-single-server) —
    # verify with `kubectl get svc -n monitoring` after first deploy.
    destinations:
      victorialogs:
        type: loki
        url: http://victorialogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/loki/api/v1/push

    # One collector, built from the two presets Grafana's own docs pair
    # for exactly this job: reading container log files, deployed as a
    # DaemonSet (one per node, matching how this was always intended to
    # run). Since there's only one collector defined, podLogsViaLoki and
    # clusterEvents below don't need an explicit `collector:` field to
    # point at it — the chart uses the only one available automatically.
    collectors:
      logs-collector:
        presets: [filesystem-log-reader, daemonset]
        # Ensures the control-plane node (PC1) is included despite its
        # scheduling taint — etcd/apiserver-adjacent logs matter given
        # that node is the single point of failure. Best-effort mapping
        # from the old alloy-logs.controller.tolerations path to this
        # collector's equivalent — if this specific sub-key errors on
        # apply (unlike collectors/presets, which are now confirmed),
        # check `helm show values grafana/k8s-monitoring --version 4.3.1`
        # for the exact current path rather than assume this comment is
        # the final word.
        controller:
          tolerations:
            - operator: Exists
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi

    # This is the actual answer to "scrape logs from all applications" —
    # discovers every pod via the Kubernetes API, no per-app config.
    podLogsViaLoki:
      enabled: true
      destinations: ["victorialogs"]

    # Bonus, same collector: Kubernetes Events (OOMKills, failed
    # schedules, image pull errors) land in VictoriaLogs too, queryable
    # alongside pod logs rather than only living in `kubectl get events`'
    # short retention window.
    clusterEvents:
      enabled: true
      destinations: ["victorialogs"]
