# Confirmed and fixed a real bug the hard way: v4 changed `destinations`
# from a list to a map keyed by name (confirmed against Grafana's own v4
# migration docs — "In v4, destinations are defined as a map instead of a
# list"). The list syntax below was wrong; this is the corrected map form.
#
# Second, UNCONFIRMED uncertainty: v4 also replaced named Alloy instances
# (alloy-metrics, alloy-logs) with a `collectors:` map — meaning the
# alloy-logs.controller.tolerations / alloy-logs.resources keys below may
# ALSO be wrong, just not yet surfaced, since Helm's schema validation
# failed on destinations first and never got to check further. If this
# still errors after the destinations fix, check
# `helm show values grafana/k8s-monitoring --version <pinned-version>`
# for the current collectors: structure rather than assuming this comment
# is the final word.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-monitoring
      version: ">=4.0.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    cluster:
      name: homelab

    # Points at VictoriaLogs, not Loki — type stays "loki" since Alloy is
    # still sending in Loki's wire format, VictoriaLogs just accepts it
    # natively on this endpoint. Service name assumes the chart's default
    # naming convention (<release-name>-victoria-logs-single-server) —
    # verify with `kubectl get svc -n monitoring` after first deploy.
    destinations:
      victorialogs:
        type: loki
        url: http://victorialogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/loki/api/v1/push

    # This is the actual answer to "scrape logs from all applications" —
    # discovers every pod via the Kubernetes API, no per-app config.
    podLogsViaLoki:
      enabled: true
      destinations: ["victorialogs"]

    # Bonus, same collector: Kubernetes Events (OOMKills, failed
    # schedules, image pull errors) land in VictoriaLogs too, queryable
    # alongside pod logs rather than only living in `kubectl get events`'
    # short retention window.
    clusterEvents:
      enabled: true
      destinations: ["victorialogs"]

    # Alloy runs as a DaemonSet by default — this just makes sure that
    # includes the control-plane node (PC1), which is otherwise tainted
    # against scheduling. Worth having: etcd/apiserver-adjacent logs are
    # useful precisely because that node is your single point of failure.
    alloy-logs:
      controller:
        tolerations:
          - operator: Exists
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
