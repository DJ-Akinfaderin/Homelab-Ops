# PHASE 1: HelmReleases (which install CRDs) plus plain core Kubernetes
# types (Namespace, ConfigMap, PVC, Deployment, Service, CronJob, Ingress).
# Nothing in this file may reference a CRD installed by anything else in
# this same file — that's exactly the bug that caused a full reconciliation
# deadlock (see clusters/homelab/infrastructure.yaml's comment for the
# full story). Custom resources that consume these CRDs live in
# ../infrastructure-config/, a separate Flux Kustomization that only
# starts once this one is confirmed healthy.
#
# Rule of thumb for where a new file goes: if its `kind` was invented by
# one of the Helm charts below (not a stock Kubernetes type), it belongs
# in infrastructure-config/, not here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sources/namespaces.yaml
  - sources/helm-repositories.yaml
  - cilium/release.yaml
  - traefik/release.yaml
  - storage/nfs-provisioner.yaml
  - monitoring/release.yaml
  - victorialogs/release.yaml
  - alloy/release.yaml
  - gatus/release.yaml
  - gatus/ingress-tailscale.yaml
  - gatus/ingress-lan.yaml
  - cnpg/release.yaml
  - authelia/release.yaml
  - tailscale/release.yaml
  - renovate/cronjob.yaml
  - tuppr/release.yaml
  - cert-manager/release.yaml
  - capacitor/source.yaml
  - capacitor/ingress-tailscale.yaml
  - capacitor/ingress-lan.yaml
  - talos-backup/cronjob.yaml
  - external-secrets/release.yaml
