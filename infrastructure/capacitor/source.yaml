# Capacitor ships as a ready-to-reconcile OCI artifact (raw manifests, not
# a Helm chart) — this is the officially documented install path from
# fluxcd.io's own blog, not a third-party packaging choice.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/gimlet-io/capacitor-manifests
  ref:
    semver: ">=0.4.0 <1.0.0"
