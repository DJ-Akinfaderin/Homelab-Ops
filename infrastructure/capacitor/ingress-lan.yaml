# Capacitor's RBAC includes read access to Secrets — the original reason
# this stayed Tailscale-only. Now that Authelia sits in front of the LAN
# route (see the middlewares annotation below and
# infrastructure/authelia/release.yaml's access_control.rules), that risk
# is covered by real authentication rather than just network-level
# privacy, so both routes can coexist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capacitor-lan
  namespace: flux-system
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: capacitor.home.dakin.im
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capacitor
                port:
                  number: 9000
  tls:
    - hosts:
        - capacitor.home.dakin.im
