apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: ">=1.16.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
  values:
    kubeProxyReplacement: true
    # Point at KubePrism (localhost:7445) rather than a single control-plane
    # IP — this is what the kubePrism patch on every node was for. It load
    # balances to whichever control-plane node is healthy, so Cilium isn't
    # hardcoded to PC1 specifically.
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # Bare-metal LoadBalancer support (replaces needing a separate MetalLB) —
    # this is what gives Traefik a real external IP.
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true

    # Observability — the relay/UI adds real RAM cost on 8GB worker nodes,
    # so it's off by default. Flip to true if you want the traffic-flow
    # visualizer and can spare ~300-500MB.
    hubble:
      enabled: true
      relay:
        enabled: false
      ui:
        enabled: false
