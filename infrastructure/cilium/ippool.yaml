# Gives Cilium a pool of IPs to hand out to LoadBalancer-type Services
# (Traefik being the main consumer) on your home LAN, and tells it to
# announce them via L2 (ARP) — no router/BGP config needed.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-pool
spec:
  blocks:
    # Single address, since Traefik is currently the only LoadBalancer-type
    # Service in this cluster. If you add another one later (a second
    # ingress, a database exposed directly, etc.), widen this to a small
    # range instead — e.g. 10.70.5.90/29 — since a /32 pool only has one
    # address to hand out.
    - cidr: 10.70.5.90/32
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-l2
spec:
  # Confirmed via `talosctl get links` that these nodes use modern
  # "predictable network interface naming" (enp0s31f6), not the legacy
  # eth0 convention this was originally written for — that mismatch meant
  # Cilium correctly held the L2 announcement lease but had zero matching
  # interfaces to actually announce on, so the LoadBalancer IP silently
  # never responded to ARP despite everything else showing healthy.
  #
  # ^en prefix (rather than the exact confirmed name alone) covers both
  # this naming convention broadly and the older eth0 style, without risk
  # of matching any of Cilium's own internal interfaces (cilium_host,
  # lxc*, veth*, bond0, etc. — none begin with "en"). Safe to leave broad
  # rather than pin to one exact interface name per node.
  interfaces:
    - ^en
  externalIPs: true
  loadBalancerIPs: true
