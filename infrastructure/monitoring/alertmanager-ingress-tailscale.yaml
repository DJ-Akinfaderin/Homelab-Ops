# This is the hostname embedded in Alertmanager's own outgoing
# notification links (see release.yaml's externalUrl) — the actual path
# you'll be tapping from a Pushover notification. Ungated, matching
# every other Tailscale route in this repo — tailnet membership is
# already a real access boundary.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager-tailscale
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-alertmanager
      port:
        number: 9093
  tls:
    - hosts:
        - alertmanager   # becomes alertmanager.<your-tailnet-name>.ts.net
