---
# Moved from grafana/helm-charts to this community-maintained repo on
# March 16, 2026 — Grafana Labs handed off chart maintenance. Don't use
# the old grafana.github.io URL for Loki specifically; it's stale now.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://grafana-community.github.io/helm-charts
---
# Unaffected by the Loki chart's move above — Alloy and k8s-monitoring
# stay on Grafana Labs' own official repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
