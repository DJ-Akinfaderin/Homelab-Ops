apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  # Confirmed via real FailedCreate events: node-exporter genuinely needs
  # privileged host-level access (hostNetwork, hostPID, raw /proc /sys /
  # mounts — that's fundamentally how it reads host metrics), and this
  # namespace was never exempted from the default "baseline" Pod Security
  # enforcement the way kube-system typically is. It never ran even once
  # in 39 hours — this isn't a regression, it's a gap from the original
  # build that only surfaced once alerting itself started working.
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
