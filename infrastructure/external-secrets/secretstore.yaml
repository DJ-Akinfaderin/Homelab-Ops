# Cluster-scoped (not namespaced SecretStore) since secrets in this repo
# span many namespaces — tailscale, renovate, harness-delegate-ng,
# kube-system-upgrade, monitoring, cert-manager. One store, referenced by
# every ExternalSecret regardless of which namespace it lives in.
#
# secretsPath is root ("/") — each ExternalSecret below references an
# absolute path like /tailscale/CLIENT_ID, mirroring this repo's own
# per-tool folder structure inside your Infisical project.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com   # change if self-hosting Infisical instead
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: client-id
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: client-secret
      secretsScope:
        projectSlug: "<your-infisical-project-slug>"   # see README.md
        environmentSlug: prod
        secretsPath: "/"
