apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: ">=33.0.0 <34.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    service:
      type: LoadBalancer   # gets its IP from the Cilium pool above
    ports:
      web:
        redirectTo:
          port: websecure
      websecure:
        tls:
          enabled: true
    # Every Traefik-routed service gets this cert automatically — no
    # per-app cert-manager annotations needed, since it's a wildcard.
    tlsStore:
      default:
        defaultCertificate:
          secretName: traefik-default-cert-tls
    # Required for the Authelia ForwardAuth Middleware (lives in the
    # authelia namespace) to be usable from Ingresses in other namespaces
    # via the router.middlewares annotation — without this, that
    # annotation is silently ignored rather than erroring loudly.
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    # Traefik's own built-in dashboard — confirmed real field structure
    # from Traefik's official docs. Creates a native IngressRoute (not a
    # standard Ingress) pointing at the special internal api@internal
    # service. Behind Authelia, same sensitivity level as Radar/Gatus —
    # this shows real operational detail about every route in the
    # cluster. LAN-only for now (no separate Tailscale route) — the
    # built-in dashboard is really a "what's configured" view more than
    # a traffic dashboard; see the metrics block below for the richer,
    # historical traffic view via Grafana.
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.home.dakin.im`)
        entryPoints:
          - websecure
        middlewares:
          - name: authelia
            namespace: authelia
    # Confirmed real field structure directly from traefik/traefik-helm-
    # chart's own EXAMPLES.md. kube-prometheus-stack's Prometheus already
    # watches ServiceMonitors cluster-wide by default, same as every
    # other PrometheusRule/ServiceMonitor in this repo — no extra label
    # wiring needed.
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
