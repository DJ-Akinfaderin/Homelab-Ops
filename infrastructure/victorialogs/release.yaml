# Single-node mode — same reasoning as everywhere else single-instance was
# chosen in this repo (Garage, CNPG): VictoriaLogs scales vertically with
# whatever resources it's given rather than needing a cluster mode for
# homelab-scale log volume.
#
# Replaced Loki after a real incident: Loki's chart shipped a memcached
# cache sub-component with a ~9.8Gi default memory request — larger than
# an entire 8GB node — that permanently blocked scheduling. VictoriaLogs
# has no equivalent sub-components to misconfigure (single binary), and
# per its own docs auto-tunes its resource usage to whatever's actually
# available rather than shipping hardcoded production-scale defaults.
# Explicit limits are still set below regardless — auto-tuning is a nice
# property, not a reason to skip stating the actual ceiling.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-logs-single
      version: ">=0.9.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  values:
    server:
      retentionPeriod: "14d"   # matches the retention pattern used for Prometheus/Loki before it
      persistentVolume:
        enabled: true
        storageClassName: nfs-client
        size: 20Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
