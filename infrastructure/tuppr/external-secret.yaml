# talosconfig is a multi-line YAML file, not a simple string — that's fine
# for Infisical, secret values can be arbitrary multi-line text. Paste the
# whole file's contents as-is when creating the secret (see README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuppr-talosconfig
  namespace: kube-system-upgrade
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: tuppr-talosconfig   # same Secret name tuppr's chart expects
    creationPolicy: Owner
  data:
    - secretKey: talosconfig
      remoteRef:
        key: "/tuppr/TALOSCONFIG"
