# talosconfig is a multi-line YAML file, not a simple string — that's fine
# for Infisical, secret values can be arbitrary multi-line text. Paste the
# whole file's contents as-is when creating the secret (see README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuppr-talosconfig
  namespace: kube-system-upgrade
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: tuppr-talosconfig   # same Secret name tuppr's chart expects
    creationPolicy: Owner
  data:
    # secretKey MUST be "config" — tuppr's admission webhook explicitly
    # validates for that exact key name on CR create/update. Named it
    # "talosconfig" originally to match Infisical's remote key, but that
    # caused every TalosUpgrade/KubernetesUpgrade apply to be rejected
    # with "talosconfig secret 'tuppr-talosconfig' missing required key
    # 'config'" — which then stalled the whole infrastructure-config
    # Flux Kustomization (and the apps Kustomization behind it via
    # dependsOn). The webhook message is completely literal.
    - secretKey: config
      remoteRef:
        key: "/tuppr/TALOSCONFIG"
