apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: kube-system-upgrade
spec:
  interval: 1h
  chart:
    spec:
      chart: tuppr
      version: ">=0.2.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tuppr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # Confirmed real gap from comparing against a working reference on
    # the same chart version (0.4.3): Helm doesn't update CRDs on
    # upgrade by default. Given how much this chart's schema has evolved
    # (the original bug this whole saga started with was reported at
    # v0.0.45), stale CRDs from an earlier attempt were a real, plausible
    # contributor worth ruling out.
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Deliberately minimal now, matching a confirmed-working reference
    # config on this exact chart version — removed controller.env
    # (TALOSCONFIG), controller.leaderElection, and rbac.create, none of
    # which that working config sets either. The TALOSCONFIG env var fix
    # was based on a real GitHub issue (tuppr#50), but that reference
    # config runs the same version successfully without it — meaning
    # either the underlying bug was actually fully fixed by 0.4.3 and my
    # fix was chasing stale information, or one of the OTHER fields
    # removed here was itself the actual problem (a stale field from an
    # earlier chart schema silently doing something unexpected rather
    # than being safely ignored). Rather than keep layering guesses on
    # top of guesses, starting from what's proven to work and adding
    # back only what's confirmed necessary.
    webhook:
      enabled: false
