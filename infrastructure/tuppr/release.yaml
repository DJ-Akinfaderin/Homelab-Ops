apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: kube-system-upgrade
spec:
  interval: 1h
  chart:
    spec:
      chart: tuppr
      version: ">=0.2.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tuppr
  values:
    controller:
      leaderElection:
        enabled: true
      # CONFIRMED fix for a real, known upstream bug — home-operations/
      # tuppr#50, closed via a fix that (based on the exact error path
      # still hit here, /home/nonroot/.talos) only covered the per-node
      # upgrade Job case, not the controller Deployment's own startup
      # client creation. talosctl/the Talos SDK falls back to creating
      # ~/.talos when TALOSCONFIG isn't set, which fails outright on this
      # read-only-root-filesystem pod. The secret IS already correctly
      # mounted at this path (confirmed in the pod spec) — this just
      # tells the client where to actually look, same fix the issue
      # reporter used via a Kyverno mutation policy, done natively here
      # instead since it's simpler and avoids a new dependency.
      env:
        - name: TALOSCONFIG
          value: /var/run/secrets/talos.dev/talosconfig
    rbac:
      create: true
    # Admission webhook validates TalosUpgrade/KubernetesUpgrade CRs on
    # creation, but needs cert-manager for its TLS cert — which isn't in
    # this stack. Left off to avoid pulling in a new dependency just for
    # this; the controller works fine without it, you just lose CR-level
    # input validation. Revisit if cert-manager gets added for other
    # reasons later.
    webhook:
      enabled: false
