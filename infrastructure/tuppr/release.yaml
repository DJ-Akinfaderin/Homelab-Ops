apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: kube-system-upgrade
spec:
  interval: 1h
  chart:
    spec:
      chart: tuppr
      version: ">=0.2.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tuppr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # Confirmed real gap from comparing against a working reference on
    # the same chart version (0.4.3): Helm doesn't update CRDs on
    # upgrade by default. Given how much this chart's schema has evolved
    # (the original bug this whole saga started with was reported at
    # v0.0.45), stale CRDs from an earlier attempt were a real, plausible
    # contributor worth ruling out.
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Deliberately minimal, matching a confirmed-working reference config
    # on this exact chart version — removed controller.env (TALOSCONFIG),
    # controller.leaderElection, and rbac.create from an earlier attempt,
    # none of which that working config sets either, and none of which
    # fixed the actual crash on their own.
    webhook:
      enabled: false
  # The actual fix, credited to a much better approach than guessing at
  # values.yaml field names (tried twice, both wrong): patch the chart's
  # RENDERED output directly via Flux's postRenderers, rather than
  # depend on the chart exposing this as a configurable value at all.
  # The pod's error is completely literal — "mkdir /home/nonroot/.talos:
  # read-only file system" — so make that exact directory writable via a
  # small emptyDir, sidestepping whatever internal env var/flag would
  # otherwise redirect it.
  #
  # Using the /-  JSON Patch "append" syntax, not a plain path replace —
  # the Deployment already has a real volumes array (the talosconfig
  # secret mount, confirmed from `kubectl describe pod` earlier) that a
  # naive `add` targeting the whole array would silently wipe out.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: tuppr
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: talos-home
                  emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: talos-home
                  mountPath: /home/nonroot/.talos
