apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
  namespace: kube-system-upgrade
spec:
  interval: 1h
  chart:
    spec:
      chart: tuppr
      version: ">=0.2.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: tuppr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # Helm doesn't update CRDs on upgrade by default. Given how much this
    # chart's schema has evolved (the original bug this whole saga started
    # with was reported at v0.0.45), stale CRDs from an earlier attempt
    # were a real, plausible contributor worth ruling out.
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Deliberately empty — no overrides needed. The prior `webhook.enabled:
  # false` looked like a way to sidestep the cert-rotation crash, but it
  # was actively CAUSING it: `webhook.enabled: false` skips the chart's
  # webhook Service AND the RBAC Role that grants the SA create/update
  # on Secrets in this namespace, but it does NOT disable the
  # cert-rotation controller inside the manager binary — that always
  # runs. Confirmed via live logs (`acquiring secret to update
  # certificates: Secret "tuppr-webhook-cert" not found`) plus
  # `kubectl auth can-i create secrets --as=system:serviceaccount:
  # kube-system-upgrade:tuppr` returning `no`. Reverting to chart
  # defaults (webhook.enabled: true) gets both the correct RBAC and the
  # correct `--webhook-secret-name` flag automatically.
  values: {}
  # Patch the chart's rendered output directly for the two REAL
  # deployment-level workarounds this cluster needs — neither of which is
  # exposed as a chart value. Using JSON Patch `add` with the `/-` array
  # append syntax; naive `add` targeting whole arrays would silently wipe
  # the existing volumes/env/volumeMounts the chart puts there.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: tuppr
            patch: |
              # The container runs with readOnlyRootFilesystem: true (chart
              # default securityContext), so talosctl's client can't
              # mkdir $HOME/.talos on startup — pod's error was completely
              # literal: "mkdir /home/nonroot/.talos: read-only file
              # system". Small emptyDir makes exactly that path writable,
              # sidestepping the client's internal default-path logic.
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: talos-home
                  emptyDir: {}
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: talos-home
                  mountPath: /home/nonroot/.talos
              # Once the emptyDir made $HOME/.talos writable, the client
              # started finding/creating an EMPTY config file there
              # instead of ever reading the real, already-correctly-
              # mounted talosconfig at /var/run/secrets/talos.dev/
              # talosconfig. TALOSCONFIG env explicitly points it at the
              # real file. Appending to the existing env array
              # (CONTROLLER_NAMESPACE etc. are already there, confirmed
              # via `kubectl describe pod`) rather than replacing it.
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value:
                  name: TALOSCONFIG
                  value: /var/run/secrets/talos.dev/talosconfig
