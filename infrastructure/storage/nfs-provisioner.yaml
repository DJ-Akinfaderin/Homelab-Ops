apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: ">=4.0.0 <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
  values:
    nfs:
      # Your NAS's LAN IP and the export path you created for this cluster.
      server: 10.70.5.185
      path: /volume1/k8s-homelab
    storageClass:
      name: nfs-client
      defaultClass: true
      reclaimPolicy: Retain
