apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harness-delegate-token
  namespace: harness-delegate-ng
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: harness-delegate-token   # same Secret name release.yaml already expects
    creationPolicy: Owner
  data:
    - secretKey: DELEGATE_TOKEN
      remoteRef:
        key: "/harness/DELEGATE_TOKEN"
