apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-env
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: renovate-env   # same Secret name the CronJob already expects
    creationPolicy: Owner
    template:
      data:
        RENOVATE_PLATFORM: github   # not actually secret, templated as a static value rather than stored in Infisical
        RENOVATE_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: "/renovate/GITHUB_TOKEN"
