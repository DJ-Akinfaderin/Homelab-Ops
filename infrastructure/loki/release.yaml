# Monolithic mode — appropriate at homelab scale (rated for up to ~20GB/day
# of logs; realistically you're nowhere near that). Filesystem storage on
# the existing nfs-client StorageClass, deliberately avoiding S3/object
# storage entirely — no dependency on Garage (which is unused/orphaned
# anyway) just to store logs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: ">=6.0.0 <7.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    deploymentMode: Monolithic

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        retention_period: 336h   # 14 days — matches the trimmed-retention pattern used for Prometheus
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
      compactor:
        retention_enabled: true   # off by default — without this, retention_period does nothing and data accumulates forever

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: nfs-client
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi

    gateway:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 128Mi

    # Zeroed out — these belong to SimpleScalable/Distributed modes, not
    # Monolithic. The chart's own validation fails if these are left at
    # their defaults alongside singleBinary.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0

    minio:
      enabled: false   # filesystem storage instead — see comment at top
    test:
      enabled: false
