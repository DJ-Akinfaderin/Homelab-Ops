# Talos's own DR path: `talosctl etcd snapshot` produces a single file that
# restores your ENTIRE cluster state on recovery — every object, every
# Secret — via `talosctl bootstrap --recover-from=<snapshot>`. This is the
# highest-leverage backup in this whole DR setup: one file replaces having
# to manually recreate 7+ out-of-band secrets by hand.
#
# Reuses the tuppr-talosconfig secret from infrastructure/tuppr/README.md —
# same credential, same client, no new secret needed here.
#
# CONFIRMED REAL BUG, fixed here: the official talosctl image has no
# shell at all (deliberately minimal) — every single run failed with
# "exec: /bin/sh: stat /bin/sh: no such file or directory", 100% of the
# time, completely unconditionally, since this file was first written.
# Unrelated to anything else fixed tonight. Fix: an init container copies
# the real talosctl binary (from Sidero Labs' own official image — not a
# third-party image, deliberately, given what this backs up) into a
# shared volume, and the actual script runs in a plain, official
# busybox image that has a genuine shell.
#
# One thing worth verifying once this runs: the exact path of the
# talosctl binary inside its own image is assumed to be /talosctl (the
# common convention for minimal single-binary images) but wasn't directly
# confirmed. If the init container fails with a "no such file" error
# itself, check the real path with:
#   kubectl run pathcheck --image=ghcr.io/siderolabs/talosctl:v1.9.0 \
#     --restart=Never --command -- find / -maxdepth 2 -name talosctl
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: kube-system-upgrade
spec:
  schedule: "30 3 * * *"   # after Renovate's nightly run (3am)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
            - name: copy-talosctl
              image: ghcr.io/siderolabs/talosctl:v1.9.0
              command: ["cp", "/talosctl", "/shared/talosctl"]
              volumeMounts:
                - name: shared-bin
                  mountPath: /shared
          containers:
            - name: etcd-snapshot
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export TALOSCONFIG=/var/run/secrets/talos.dev/talosconfig
                  DATE=$(date +%Y%m%d-%H%M%S)
                  /shared/talosctl etcd snapshot /backups/etcd-snapshot-${DATE}.db
                  # keep the last 14 daily snapshots, prune older ones
                  cd /backups && ls -t etcd-snapshot-*.db | tail -n +15 | xargs -r rm --
              volumeMounts:
                - name: talosconfig
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: shared-bin
                  mountPath: /shared
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          restartPolicy: Never
          volumes:
            - name: talosconfig
              secret:
                secretName: tuppr-talosconfig
            - name: backups
              persistentVolumeClaim:
                claimName: etcd-backups
            - name: shared-bin
              emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-backups
  namespace: kube-system-upgrade
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
