# PHASE 2 — every custom resource that depends on a CRD from Phase 1,
# EXCEPT ClusterSecretStore and ExternalSecrets (Phase 1.5, split out
# after the tuppr ExternalSecret / webhook-validation deadlock — see the
# top comment in ../../infrastructure-secrets/kustomization.yaml for the
# full incident writeup).
#
# dependsOn: infrastructure-secrets + wait: true means this genuinely
# waits for every ExternalSecret to have populated its target Secret
# before dry-running any resource here — not just for the ExternalSecrets
# to have been applied. That's the guarantee that keeps webhook-validated
# CRs (like tuppr's) from failing admission because a referenced Secret
# key isn't there yet.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-secrets
  interval: 10m
  path: ./infrastructure-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
