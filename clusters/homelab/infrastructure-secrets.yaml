# PHASE 1.5 of infrastructure — ClusterSecretStore + every ExternalSecret,
# reconciled between Phase 1 (HelmReleases) and Phase 2 (all other CRs).
# See ../../infrastructure-secrets/kustomization.yaml's top comment for
# the incident that motivated splitting this out.
#
# `wait: true` here is load-bearing: it ensures every ExternalSecret
# reports Ready (target Secret populated) before Phase 2's dry-run
# runs. Without it, Phase 2 could still race a slow-syncing
# ExternalSecret and fail its webhook validation — exactly the failure
# mode this whole split exists to prevent.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./infrastructure-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
