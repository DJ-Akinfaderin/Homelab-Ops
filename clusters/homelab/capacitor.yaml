# A separate top-level entry point rather than nesting inside
# infrastructure/kustomization.yaml — Capacitor's OCI artifact is meant to
# be reconciled directly by a Flux Kustomization, not run through a kustomize
# build alongside Helm-based resources. The artifact should bundle its own
# namespace/RBAC/Deployment/Service — verify with `flux get kustomizations`
# after first reconcile that all of those actually landed; if the RBAC
# didn't come bundled, it's documented separately at
# https://github.com/gimlet-io/capacitor under deploy/k8s/rbac.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capacitor
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: OCIRepository
    name: capacitor
  path: ./
  prune: true
  wait: true
  timeout: 5m
  # Revised after a second independent real-world config confirmed the
  # first: both agree on a 2Gi memory LIMIT specifically (different
  # requests, same ceiling) and both set explicit ephemeral-storage
  # limits — neither of which the original patch included. Two
  # independent sources converging on the same ceiling is a real signal
  # that Capacitor's actual peak usage under load approaches that range;
  # the original 768Mi limit here risked an OOM-kill at exactly the
  # moment of heavy event processing, which would explain continued
  # instability even after a partial fix. Request kept modest — the
  # limit is what actually matters here.
  patches:
    - target:
        kind: Deployment
        name: capacitor
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/resources
          value:
            requests:
              cpu: 50m
              memory: 100Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 2Gi
