# PHASE 1 of infrastructure — HelmReleases and CRD-safe core resources
# only. Split into two Kustomizations (this one + infrastructure-config.yaml
# below) after a real incident: putting CRD-installing HelmReleases and
# the custom resources that depend on those CRDs in the same Kustomization
# caused Flux to fail its dry-run validation across the WHOLE batch
# whenever any one CRD wasn't registered yet.
#
# A SECOND real incident, found later the same night, is why this no
# longer uses a blanket `wait: true`: several HelmReleases here (Harness,
# Tailscale, Authelia, kube-prometheus-stack's Alertmanager) mount Secrets
# that only get created by ExternalSecrets living in Phase 2 — which is
# blocked behind THIS Kustomization being healthy. Blanket wait: true
# health-checks every resource, so any one of those pods sitting unable
# to start (missing Secret) would permanently block this entire
# Kustomization, which blocks Phase 2, which is the only thing that could
# ever create the missing Secret in the first place — a genuine deadlock,
# not a timing issue.
#
# A THIRD incident: tuppr's HelmRelease has a real, unfixed chart error
# (ServiceAccount/talos.dev schema issue — see infrastructure/tuppr's
# history). Since it was in this healthChecks list, its permanent failure
# meant `infrastructure` could never reach Ready at all — not a timing
# problem, a genuine standing block. Removed until tuppr's actual fix is
# in — its CRDs aren't needed elsewhere in Phase 1, only by
# infrastructure-config/tuppr/upgrades.yaml, which was pulled out of
# Phase 2 for the same reason (if tuppr's release failed completely, its
# CRDs likely never registered, which would've made THAT dry-run fail the
# same way cert-manager's did in the very first incident tonight). Add
# both back once tuppr's chart values are actually fixed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: kube-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: kube-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: cnpg-system
  timeout: 5m
