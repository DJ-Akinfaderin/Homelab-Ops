# PHASE 1 of infrastructure — HelmReleases and CRD-safe core resources
# only. Split into two Kustomizations (this one + infrastructure-config.yaml
# below) after a real incident: putting CRD-installing HelmReleases and
# the custom resources that depend on those CRDs in the same Kustomization
# caused Flux to fail its dry-run validation across the WHOLE batch
# whenever any one CRD wasn't registered yet.
#
# A SECOND real incident, found later the same night, is why this no
# longer uses a blanket `wait: true`: several HelmReleases here (Harness,
# Tailscale, Authelia, kube-prometheus-stack's Alertmanager) mount Secrets
# that only get created by ExternalSecrets living in Phase 2 — which is
# blocked behind THIS Kustomization being healthy. Blanket wait: true
# health-checks every resource, so any one of those pods sitting unable
# to start (missing Secret) would permanently block this entire
# Kustomization, which blocks Phase 2, which is the only thing that could
# ever create the missing Secret in the first place — a genuine deadlock,
# # not a timing issue.
#
# A THIRD incident happened here earlier: tuppr's HelmRelease was failing
# with a real chart error (ServiceAccount/talos.dev schema issue) that
# turned out to be a genuine infrastructure gap, not a chart bug — the
# machine config feature its ServiceAccount CR depends on
# (kubernetesTalosAPIAccess) was never enabled anywhere in this cluster.
# See talos/patches/kubernetes-talos-api-access.yaml for the actual fix.
# Re-added here now that it's confirmed working — Phase 2's
# infrastructure-config/tuppr/upgrades.yaml depends on tuppr's CRDs
# actually being registered, same reasoning as the other 6 apps in this
# list; without this, there'd be a real race risk of Phase 2 trying to
# apply TalosUpgrade/KubernetesUpgrade CRs before those CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: kube-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: kube-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: cnpg-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tuppr
      namespace: kube-system-upgrade
  timeout: 5m
