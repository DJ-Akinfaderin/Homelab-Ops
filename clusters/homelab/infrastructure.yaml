# PHASE 1 of infrastructure — HelmReleases and CRD-safe core resources
# only. Split into two Kustomizations (this one + infrastructure-config.yaml
# below) after a real incident: putting CRD-installing HelmReleases and
# the custom resources that depend on those CRDs in the same Kustomization
# caused Flux to fail its dry-run validation across the WHOLE batch
# whenever any one CRD wasn't registered yet.
#
# A SECOND real incident, found later the same night, is why this no
# longer uses a blanket `wait: true`: several HelmReleases here (Harness,
# Tailscale, Authelia, kube-prometheus-stack's Alertmanager) mount Secrets
# that only get created by ExternalSecrets living in Phase 2 — which is
# blocked behind THIS Kustomization being healthy. Blanket wait: true
# health-checks every resource, so any one of those pods sitting unable
# to start (missing Secret) would permanently block this entire
# Kustomization, which blocks Phase 2, which is the only thing that could
# ever create the missing Secret in the first place — a genuine deadlock,
# # # not a timing issue.
#
# A THIRD incident: tuppr's HelmRelease turned out to have multiple real,
# separate bugs (a machine-config prerequisite the chart never mentioned,
# then an incomplete upstream fix for a read-only-filesystem crash, still
# being worked through). Re-added to this list once the FIRST bug looked
# fixed, but tuppr's continued instability meant every reconcile of this
# entire Kustomization legitimately stalled waiting on it — a single
# unhealthy app making the whole cluster's Flux status unreadable, not
# just its own. Removed again until tuppr is genuinely, stably healthy.
# Its CRDs aren't needed elsewhere in Phase 1, only by
# infrastructure-config/tuppr/upgrades.yaml — if tuppr's CRDs become
# unregistered again, that Kustomization would fail the same way
# cert-manager's did in the very first incident tonight, so don't re-add
# upgrades.yaml to Phase 2 until this is confirmed working end to end.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cilium
      namespace: kube-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: kube-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg
      namespace: cnpg-system
  timeout: 5m
