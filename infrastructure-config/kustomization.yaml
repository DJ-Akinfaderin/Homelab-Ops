# PHASE 2: every resource whose `kind` is a CRD installed by a HelmRelease
# in ../infrastructure/. Reconciled by a separate Flux Kustomization
# (clusters/homelab/infrastructure-config.yaml) that depends on the
# infrastructure Kustomization being fully healthy first — see that file's
# comment for why this split exists at all.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cilium.io CRDs, from cilium/release.yaml
  - ../infrastructure/cilium/ippool.yaml

  # cert-manager.io CRDs, from cert-manager/release.yaml
  - ../infrastructure/cert-manager/cluster-issuer.yaml
  - ../infrastructure/cert-manager/certificate.yaml

  # external-secrets.io CRDs, from external-secrets/release.yaml —
  # secretstore.yaml first conceptually (everything else references it),
  # though ordering within this file doesn't matter for apply-time
  # success, only for how quickly ExternalSecrets actually sync.
  - ../infrastructure/external-secrets/secretstore.yaml
  - ../infrastructure/monitoring/external-secret.yaml
  - ../infrastructure/gatus/external-secret.yaml
  - ../infrastructure/tailscale/external-secret.yaml
  - ../infrastructure/renovate/external-secret.yaml
  - ../infrastructure/tuppr/external-secret.yaml
  - ../infrastructure/cert-manager/external-secret.yaml
  - ../infrastructure/authelia/external-secret-postgres.yaml
  - ../infrastructure/authelia/external-secret-core.yaml
  - ../infrastructure/authelia/external-secret-users.yaml

  # monitoring.coreos.com CRDs, from monitoring/release.yaml
  - ../infrastructure/monitoring/rules/media-apps.yaml
  - ../infrastructure/monitoring/rules/cluster-ops.yaml

  # tuppr.home-operations.com CRDs, from tuppr/release.yaml — re-added
  # after the actual root cause was confirmed and fixed: the chart's
  # release wasn't failing on its own account, it needed
  # kubernetesTalosAPIAccess enabled in the machine config first (see
  # talos/patches/kubernetes-talos-api-access.yaml). Applying that patch
  # to the live cluster is a separate, required step before this
  # reconciles cleanly — see infrastructure/tuppr/README.md.
  - ../infrastructure/tuppr/upgrades.yaml

  # traefik.io CRDs, from traefik/release.yaml
  - ../infrastructure/authelia/middleware.yaml
  - ../infrastructure/radar/middleware-strip-headers.yaml

  # postgresql.cnpg.io CRDs, from cnpg/release.yaml
  - ../infrastructure/authelia/postgres-cluster.yaml

  # external-secrets.io CRDs, from external-secrets/release.yaml
  - ../infrastructure/radar/external-secret.yaml
