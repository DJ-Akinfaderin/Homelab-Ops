# PHASE 2: every custom resource whose `kind` is a CRD installed by a
# HelmRelease in ../infrastructure/, EXCEPT ClusterSecretStore and
# ExternalSecrets — those live in ../infrastructure-secrets/ (Phase 1.5)
# so they're guaranteed to be synced before any resource here that
# depends on the Secrets they produce. Reconciled by a separate Flux
# Kustomization (../clusters/homelab/infrastructure-config.yaml) that
# depends on Phase 1.5 being fully healthy first.
#
# Rule of thumb for where a new file goes:
#   - `kind` is a stock K8s type → ../infrastructure/
#   - `kind` is ClusterSecretStore or ExternalSecret → ../infrastructure-secrets/
#   - `kind` is any other CRD-defined type → here (../infrastructure-config/)
#
# ─── TEMPORARILY DISABLED RESOURCES ────────────────────────────────────
# When commenting out a resource below to work around an outage or a
# crash-looping HelmRelease, add its path and a one-line reason here so
# future-you (or triage) can grep TEMPORARILY DISABLED and see at a
# glance what's off. Re-enable when the underlying issue is fixed and
# delete the entry.
#
# Currently disabled: (none)
# ───────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cilium.io CRDs, from cilium/release.yaml
  - ../infrastructure/cilium/ippool.yaml

  # cert-manager.io CRDs, from cert-manager/release.yaml
  - ../infrastructure/cert-manager/cluster-issuer.yaml
  - ../infrastructure/cert-manager/certificate.yaml

  # monitoring.coreos.com CRDs, from monitoring/release.yaml
  - ../infrastructure/monitoring/rules/media-apps.yaml
  - ../infrastructure/monitoring/rules/cluster-ops.yaml

  # tuppr.home-operations.com CRDs, from tuppr/release.yaml
  - ../infrastructure/tuppr/upgrades.yaml

  # traefik.io CRDs, from traefik/release.yaml
  - ../infrastructure/authelia/middleware.yaml
  - ../infrastructure/radar/middleware-strip-headers.yaml

  # postgresql.cnpg.io CRDs, from cnpg/release.yaml
  - ../infrastructure/authelia/postgres-cluster.yaml
