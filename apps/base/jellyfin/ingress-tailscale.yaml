# Private remote access — reachable only from devices logged into your
# tailnet. Nothing here makes this public; that would require a separate
# tailscale.com/funnel annotation, which is deliberately not used.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-tailscale
  namespace: media
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: jellyfin
      port:
        number: 8096
  tls:
    - hosts:
        - jellyfin   # becomes jellyfin.<your-tailnet-name>.ts.net
