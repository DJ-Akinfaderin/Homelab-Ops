apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
# Note: the shared "media-library" PVC lives in apps/base/media-shared/
# (kept separate since other apps may mount it too).
